<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Membership Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Library Membership Form</h1>
    <form id="membershipForm" onsubmit="showMembershipCard(event)">
        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Age:</label>
        <input type="number" id="age" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Phone:</label>
        <input type="text" id="phone" required>
        <br><br>

        <label>Choice:</label>
        <input type="radio" name="membership" value="Basic" checked> Basic
        <input type="radio" name="membership" value="Silver"> Silver
        <input type="radio" name="membership" value="Gold"> Gold
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <hr>
    <div id="card"></div>

    <script src="script.js"></script>
</body>
</html>
